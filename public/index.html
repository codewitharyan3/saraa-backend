<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SARAA</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app">

      <header class="topbar">
        <div class="brand">
          <img src="icon.svg" class="brand-icon" alt="" />
          <span>SARAA</span>
        </div>
        <button id="newChatBtn" class="icon-btn" title="New chat">+</button>
      </header>

      <!-- ===== CHAT VIEW ===== -->
      <section id="chatView" class="view">
        <div id="welcome" class="welcome">
          <h1>SARAA</h1>
          <p class="tagline">Snehal Aryan's Really Awesome Assistant</p>
          <p class="prompt">How can I help you today?</p>
        </div>

        <div id="messages" class="messages"></div>

        <div id="pendingAttachments" class="pending-attachments">
          <div id="imagePreview" class="attachment-chip" style="display:none;">
            <img id="imagePreviewImg" src="" alt="attached" />
            <button id="removeImageBtn" class="remove-badge">&times;</button>
          </div>
          <div id="videoPreview" class="attachment-chip video-chip" style="display:none;">
            <span class="video-icon">🎥</span>
            <span>Video attached</span>
            <button id="removeVideoBtn" class="remove-x">&times;</button>
          </div>
        </div>

        <footer class="input-bar">
          <button id="attachImageBtn" class="icon-btn" title="Attach image">🖼️</button>
          <button id="attachVideoBtn" class="icon-btn" title="Attach video">🎥</button>
          <input type="file" id="imageInput" accept="image/*" style="display:none;" />
          <input type="file" id="videoInput" accept="video/*" style="display:none;" />
          <input type="text" id="textInput" placeholder="Message SARAA…" />
          <button id="micBtn" class="icon-btn" title="Voice input">🎤</button>
          <button id="sendBtn" class="send-btn" title="Send">➤</button>
        </footer>
      </section>

      <!-- ===== HISTORY VIEW (placeholder, matches mobile roadmap) ===== -->
      <section id="historyView" class="view placeholder-view" style="display:none;">
        <div class="placeholder">
          <span class="placeholder-icon">🕑</span>
          <p>Saved chat history on desktop is coming in a future update.</p>
        </div>
      </section>

      <!-- ===== SETTINGS VIEW (placeholder, matches mobile roadmap) ===== -->
      <section id="settingsView" class="view placeholder-view" style="display:none;">
        <div class="placeholder">
          <span class="placeholder-icon">⚙️</span>
          <p>Settings (theme, language, voice) are coming in a future update.</p>
        </div>
      </section>

      <!-- ===== BOTTOM NAV (matches the mobile app) ===== -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-view="chatView">
          <span class="nav-icon">💬</span><span>Chat</span>
        </button>
        <button class="nav-item" data-view="historyView">
          <span class="nav-icon">🕑</span><span>History</span>
        </button>
        <button class="nav-item" data-view="settingsView">
          <span class="nav-icon">⚙️</span><span>Settings</span>
        </button>
      </nav>

    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
